name: Refresh cattle market history

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/refresh_market_data.py"
      - "tests/**"
      - ".github/workflows/refresh-market-data.yml"
  schedule:
    - cron: "17 14 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: market-data-refresh-v3
  # Never overlap two writers to the same generated JSON files. Queue refreshes
  # instead of cancelling a run during its commit/rebase phase.
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install data collection dependencies
        run: pip install requests beautifulsoup4 pypdf
      - name: Collect, normalize, and quality-check published market data
        run: python scripts/refresh_market_data.py
      - name: Run market-data quality tests against the freshly collected data
        run: python -m unittest discover -s tests -v
      - name: Commit updated market history
        run: |
          if [ -n "$(git status --porcelain -- data/market_observations.json data/market_data_qa.json data/quarantine_observations.json data/futures.json data/usda_outlook.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            cp data/market_observations.json /tmp/local_market.json
            if [ -f data/quarantine_observations.json ]; then
              cp data/quarantine_observations.json /tmp/local_quarantine.json
            else
              printf '{"rejected_observations": []}\n' > /tmp/local_quarantine.json
            fi

            # Another refresh may have pushed while this run was collecting.
            # Merge observations by stable ID instead of rebasing conflicting JSON blobs.
            for attempt in 1 2 3 4 5; do
              echo "Publishing market data, attempt $attempt"
              git fetch origin main
              git show origin/main:data/market_observations.json > /tmp/remote_market.json
              git show origin/main:data/quarantine_observations.json > /tmp/remote_quarantine.json 2>/dev/null || printf '{"rejected_observations": []}\n' > /tmp/remote_quarantine.json
              python - <<'PY'
          import json
          import sys
          from pathlib import Path

          local = json.loads(Path("/tmp/local_market.json").read_text(encoding="utf-8"))
          remote = json.loads(Path("/tmp/remote_market.json").read_text(encoding="utf-8"))
          qa_path = Path("data/market_data_qa.json")
          quarantine_path = Path("data/quarantine_observations.json")
          qa = json.loads(qa_path.read_text(encoding="utf-8"))
          local_quarantine = json.loads(Path("/tmp/local_quarantine.json").read_text(encoding="utf-8"))
          remote_quarantine = json.loads(Path("/tmp/remote_quarantine.json").read_text(encoding="utf-8"))
          if not local_quarantine.get("rejected_observations") and qa.get("rejected_observations"):
              # One-time compatibility with legacy QA reports embedding quarantine rows.
              local_quarantine["rejected_observations"] = qa.get("rejected_observations", [])
          quarantine_by_key = {}
          for row in remote_quarantine.get("rejected_observations", []) + local_quarantine.get("rejected_observations", []):
              quarantine_by_key[(row.get("collection"), row.get("id"))] = row
          rejected = list(quarantine_by_key.values())
          rejected_ids = {
              "records": {row.get("id") for row in rejected if row.get("collection") == "records"},
              "cow_records": {row.get("id") for row in rejected if row.get("collection") == "cow_records"},
          }
          for key in ("records", "cow_records"):
              # Never reintroduce quarantined legacy observations from the remote copy.
              merged = {
                  item["id"]: item for item in remote.get(key, [])
                  if item.get("id") not in rejected_ids[key]
              }
              for item in local.get(key, []):
                  merged[item["id"]] = item
              local[key] = sorted(
                  merged.values(),
                  key=lambda item: (item.get("date", ""), item.get("market", ""), item.get("id", ""))
              )
          local["record_count"] = len(local.get("records", []))
          local["cow_record_count"] = len(local.get("cow_records", []))
          accepted_market_ids = {row.get("id") for row in local.get("records", [])}
          accepted_cow_ids = {row.get("id") for row in local.get("cow_records", [])}
          rejected = [
              row for row in rejected
              if not (row.get("collection") == "records" and row.get("id") in accepted_market_ids)
              and not (row.get("collection") == "cow_records" and row.get("id") in accepted_cow_ids)
          ]
          rejected_records = [row for row in rejected if row.get("collection") == "records"]
          rejected_cows = [row for row in rejected if row.get("collection") == "cow_records"]
          quarantine_path.write_text(json.dumps({
              "schema_version": 1,
              "generated_at": local_quarantine.get("generated_at"),
              "record_count": len(rejected),
              "market_record_count": len(rejected_records),
              "cow_record_count": len(rejected_cows),
              "rejected_observations": rejected,
          }, indent=2) + "\n", encoding="utf-8")

          # Rebuild QA totals after merging so the report and public arrays stay in sync.
          sys.path.insert(0, "scripts")
          from refresh_market_data import build_qa_report
          from market_model import build_benchmarks
          collected_qa = json.loads(qa_path.read_text(encoding="utf-8"))
          qa = build_qa_report(local["records"], local["cow_records"], rejected_records, rejected_cows, collected_qa.get("source_fetch_health", {}))
          quarantine_rows = rejected_records + rejected_cows
          quarantine_path.write_text(json.dumps({
              "schema_version": 1,
              "generated_at": collected_qa.get("generated_at"),
              "record_count": len(quarantine_rows),
              "market_record_count": len(rejected_records),
              "cow_record_count": len(rejected_cows),
              "rejected_observations": quarantine_rows,
          }, indent=2) + "\n", encoding="utf-8")
          qa["quarantine_report_url"] = "data/quarantine_observations.json"
          qa["quarantine_summary"] = {
              "total": len(quarantine_rows),
              "market_records": len(rejected_records),
              "cow_records": len(rejected_cows),
          }
          qa.pop("rejected_observations", None)
          qa_path.write_text(json.dumps(qa, indent=2) + "\n", encoding="utf-8")
          local["schema_version"] = 7
          local["benchmarks"] = build_benchmarks(local["records"], local["cow_records"])
          local["qa_summary"] = {
              "market_records_accepted": len(local["records"]),
              "market_records_rejected": len(rejected_records),
              "cow_records_accepted": len(local["cow_records"]),
              "cow_records_rejected": len(rejected_cows),
          }
          Path("/tmp/merged_market.json").write_text(
              json.dumps(local, indent=2) + "\n", encoding="utf-8"
          )
          PY
              git reset --mixed origin/main
              cp /tmp/merged_market.json data/market_observations.json
              python -m unittest discover -s tests -v
              git add data/market_observations.json data/market_data_qa.json data/quarantine_observations.json data/futures.json data/usda_outlook.json
              if git diff --cached --quiet; then
                echo "No new market observations."
                exit 0
              fi
              git commit -m "Refresh published cattle market history"
              if git push origin HEAD:main; then
                echo "Market data commit pushed successfully."
                exit 0
              fi
              cp data/market_observations.json /tmp/local_market.json
              echo "Main advanced during push; retrying with the newest published records."
            done
            echo "Could not publish market data after five attempts."
            exit 1
          else
            echo "No new market observations."
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
