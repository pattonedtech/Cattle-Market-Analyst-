name: Refresh cattle market history

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/refresh_market_data.py"
      - ".github/workflows/refresh-market-data.yml"
  schedule:
    - cron: "17 14 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: market-data-refresh-v3
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install data collection dependencies
        run: pip install requests beautifulsoup4 pypdf
      - name: Collect and normalize published market data
        run: python scripts/refresh_market_data.py
      - name: Commit updated market history
        run: |
          if [ -n "$(git status --porcelain -- data/market_observations.json data/futures.json data/usda_outlook.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/market_observations.json data/futures.json data/usda_outlook.json
            git commit -m "Refresh published cattle market history"
            # The dashboard HTML may be committed while collection is running.
            # Rebase the generated-data commit onto the latest main before pushing.
            git pull --rebase origin main
            git push
          else
            echo "No new market observations."
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
