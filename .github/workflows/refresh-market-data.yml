name: Refresh cattle market history

on:
  schedule:
    - cron: "17 14 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install data collection dependencies
        run: pip install requests beautifulsoup4 pypdf
      - name: Collect and normalize published market data
        run: python scripts/refresh_market_data.py
      - name: Commit updated market history
        run: |
          if ! git diff --quiet -- data/market_observations.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/market_observations.json
            git commit -m "Refresh published cattle market history"
            git push
          else
            echo "No new market observations."
          fi
