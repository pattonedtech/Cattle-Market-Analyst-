name: Market data pull request quality checks

on:
  push:
    branches: ["main"]
    paths:
      - "data/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/market-data-pr-check.yml"
      - "DATA_DICTIONARY.md"
  pull_request:
    branches: ["main"]
    paths:
      - "data/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/market-data-pr-check.yml"
      - "DATA_DICTIONARY.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out proposed changes
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install collector dependencies
        run: pip install requests beautifulsoup4 pypdf
      - name: Run parser and data integrity tests
        run: python -m unittest discover -s tests -v
